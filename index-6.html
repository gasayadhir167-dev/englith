<title>ENGINEER ENGLISH</title>
<style>
:root{
  --bg:#0E1317;
  --bg-2:#151C22;
  --line:#232C34;
  --ink:#E9E6DF;
  --ink-2:#8794A0;
  --ink-3:#57646F;
  --brass:#D8B45C;
  --jade:#5FBFA0;
  --rust:#C2604B;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
.en,.lit,.nat,.mine,.eg{user-select:text;-webkit-user-select:text}
html{height:100%}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

.app{
  min-height:100dvh;display:flex;flex-direction:column;
  max-width:600px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* ============ 首页 ============ */
.home{flex:1;display:flex;flex-direction:column;padding:0 26px 30px}
.title{
  margin:7vh 0 0;font-family:var(--mono);font-size:13px;
  letter-spacing:.36em;color:var(--ink-3);
}
.stats{margin-top:auto;display:flex;flex-direction:column}
.stat{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:20px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;
}
.stat:first-child{border-top:1px solid var(--line)}
.stat .k{color:var(--ink-2);font-size:14.5px;letter-spacing:.02em}
.stat .v{font-family:var(--mono);font-size:30px;color:var(--ink);letter-spacing:-.01em}
.stat .v small{font-size:15px;color:var(--ink-3)}
.stat .v.lock{font-size:15px;color:var(--ink-3);letter-spacing:.02em}
.stat .v.open{font-size:15px;color:var(--brass);letter-spacing:.02em}

.start{
  margin-top:34px;height:56px;width:100%;border-radius:13px;
  background:var(--brass);color:#181206;font-weight:600;letter-spacing:.14em;
  display:flex;align-items:center;justify-content:center;transition:opacity .15s;
}
.start:active{opacity:.82}

.prefs{margin-top:30px;display:flex;flex-direction:column;gap:16px}
.pref{display:flex;align-items:center;justify-content:space-between;gap:16px}
.pref .lab{color:var(--ink-3);font-size:13px;letter-spacing:.02em;white-space:nowrap}
.pick{display:flex;gap:8px}
.pick button{
  min-width:52px;height:34px;border-radius:9px;border:1px solid var(--line);
  color:var(--ink-3);font-family:var(--mono);font-size:13px;
}
.pick button.sel{border-color:var(--brass);color:var(--brass)}

/* ============ 顶栏 ============ */
.bar{display:flex;align-items:center;gap:12px;padding:14px 22px 10px;min-height:50px}
.bar .back{color:var(--ink-2);font-size:15px}
.bar .mid{flex:1;text-align:center;color:var(--ink-3);font-size:12.5px;letter-spacing:.12em;font-family:var(--mono)}
.bar .right{min-width:58px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar .right.hot{color:var(--brass)}
.rail{height:2px;background:var(--line);margin:0 22px;border-radius:2px;overflow:hidden}
.rail i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s ease}

/* ============ 铭牌 ============ */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:12px 22px;overflow-y:auto}
.zh{text-align:center;font-size:29px;font-weight:600;letter-spacing:.05em;line-height:1.35}
.ipa{text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-top:8px;letter-spacing:.02em}

.plate{
  margin:32px auto 0;width:fit-content;max-width:100%;
  font-family:var(--mono);font-size:var(--cw,30px);letter-spacing:var(--ls);
  padding:0 1.5ch;
}
.row,.ghost,#keys{
  font-family:inherit;font-size:inherit;letter-spacing:inherit;
  line-height:1.5;white-space:pre;
}
.answer{padding-right:3ch}
.answer .cell{color:var(--brass);transition:color .15s ease}
.answer .cell.miss{color:var(--rust)}
.typedwrap{position:relative;margin-top:3px}
.ghost{position:absolute;left:0;top:0;pointer-events:none}
.ghost .cell{color:var(--ink);border-bottom:1.5px solid var(--line);transition:color .15s ease,border-color .15s ease}
.ghost .cell.miss,.ghost .cell.extra{color:var(--rust);border-bottom-color:var(--rust)}
.ghost .cell.slot{color:var(--ink-3);opacity:.3}
.ok .ghost .cell{color:var(--jade);border-bottom-color:var(--jade)}
.ok .answer .cell{color:var(--jade)}
.ok .plate{animation:lift .2s ease-out}
@keyframes lift{from{opacity:.5}to{opacity:1}}
#keys{
  display:block;width:100%;margin:0;padding:0;border:0;background:transparent;
  color:transparent;caret-color:var(--brass);outline:none;border-radius:0;
  -webkit-text-fill-color:transparent;
}
#keys::selection{background:rgba(216,180,92,.3)}

.hint{min-height:20px;text-align:center;margin-top:24px;font-size:13.5px;color:var(--ink-3)}
.hint.warn{color:var(--rust)}
.hint.good{color:var(--jade)}
.eg{
  margin:14px auto 0;max-width:34em;text-align:center;
  font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--ink-3);opacity:.72;
}
.acts{padding:0 22px 26px}
.btn{
  width:100%;height:54px;border-radius:13px;background:var(--brass);color:#181206;
  font-weight:600;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;
  transition:opacity .15s;
}
.btn:active{opacity:.82}
.btn.quiet{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-weight:400;letter-spacing:.04em}

/* 语音按钮 */
.sayrow{display:flex;justify-content:center;margin-top:16px;min-height:34px}
.say{
  display:inline-flex;align-items:center;gap:7px;height:34px;padding:0 16px;
  border:1px solid var(--brass);border-radius:17px;color:var(--brass);
  font-size:13px;letter-spacing:.06em;
}
.say[hidden]{display:none}
.say:active{background:rgba(216,180,92,.12)}
.say svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.say svg path:first-child{fill:currentColor;stroke:none}

/* 句子输入页 */
.sinput{flex:1;min-height:0;overflow-y:auto;padding:10px 20px 0;display:flex;flex-direction:column}
.steplab{text-align:center;font-size:12px;letter-spacing:.14em;color:var(--ink-3);margin:6px 0 18px}
.plate.wide{width:100%;padding:0;--ls:0}
.plate.wide .answer{padding-right:0}
.plate.wide .row,.plate.wide .ghost,.plate.wide textarea{
  white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;line-height:1.75;
}
.plate.wide .ghost{width:100%}
#siKeys{
  display:block;width:100%;min-height:5.4em;resize:none;margin:0;padding:0;border:0;
  background:transparent;color:transparent;caret-color:var(--brass);outline:none;
  font-family:inherit;font-size:inherit;letter-spacing:inherit;overflow:hidden;
  -webkit-text-fill-color:transparent;
}
#siKeys::selection{background:rgba(216,180,92,.3)}
.plate.wide .answer{margin-bottom:14px;padding-bottom:14px;border-bottom:1px solid var(--line)}

/* ============ 词库 ============ */
.lib{flex:1;min-height:0;overflow-y:auto;padding:6px 24px 0}
.bank{
  width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:18px 0;border-bottom:1px solid var(--line);
}

/* =========================================================
   BOOKS — 词库来源（学习记录按英文单词共享，不随词库重复）
   ========================================================= */
const BANKS = [
  { id:"field", name:"现场工程词", note:"驻场维修现场用词" },
  { id:"cet4",  name:"CET-4",     note:"精选词表，非完整大纲" },
  { id:"cet6",  name:"CET-6",     note:"精选词表，非完整大纲" },
  { id:"cet46", name:"CET-4 + CET-6", note:"两级合并" },
  { id:"mine",  name:"我的词库",   note:"自己导入的词" }
];
function parseRaw(raw, source){
  return raw.trim().split("\n").map(l => {
    const p = l.split("|");
    return { word:p[0].trim(), meaning:p[1].trim(), phonetic:p[2].trim(), example:p[3].trim(), source:source };
  });
}
const BOOKS = {
  field: WORDS.map(w => ({ word:w[0], meaning:w[1], phonetic:w[2], example:w[3], source:"现场工程词" })),
  cet4:  parseRaw(CET4_RAW, "CET-4"),
  cet6:  parseRaw(CET6_RAW, "CET-6")
};
const kw = w => (w || "").trim().toLowerCase();
function dedup(list){
  const seen = new Set(), out = [];
  list.forEach(w => { const k = kw(w.word); if(k && !seen.has(k)){ seen.add(k); out.push(w); } });
  return out;
}
function bankWords(id){
  if(id === "mine")  return dedup((S.mine || []).map(w => Object.assign({ source:"我的词库" }, w)));
  if(id === "cet46") return dedup(BOOKS.cet4.concat(BOOKS.cet6));
  return dedup(BOOKS[id] || BOOKS.field);
}
function bankName(id){ const b = BANKS.find(x => x.id === id); return b ? b.name : "现场工程词"; }
/** 单词数据结构：id / word / meaning / phonetic / example / source
 *  successCount（正确输入次数，写错不清零）/ audioUnlocked / wrongCount */
function record(w){
  const k = kw(w.word), n = S.oks[k] || 0;
  return Object.assign({ id:"w_" + k }, w, {
    successCount: n,
    audioUnlocked: n >= AUDIO_AT,
    mastery: n,                     // 兼容旧导出文件
    correctCount: n,
    wrongCount: S.errs[k] || 0
  });
}
/** 句子数据结构，和单词完全独立，两套次数互不影响 */
function sentRecord(i){
  const n = S.sOks[i] || 0;
  return { id:"s_" + i, text:SENTS[i][0], literal:SENTS[i][1], natural:SENTS[i][2],
           successCount:n, audioUnlocked:n >= AUDIO_AT, wrongCount:S.sErrs[i] || 0 };
}
function bankStats(id){
  const ws = bankWords(id);
  let m = 0, l = 0;
  ws.forEach(w => {
    const k = kw(w.word), n = S.oks[k] || 0;
    if(n >= AUDIO_AT) m++;
    else if(n > 0 || S.errs[k]) l++;
  });
  return { total:ws.length, unlocked:m, mastered:m, learning:l };
}
function totalUnlocked(){ return Object.keys(S.oks).filter(k => S.oks[k] >= AUDIO_AT).length; }
function sentUnlocked(){ return SENTS.filter((x, i) => (S.sOks[i] || 0) >= AUDIO_AT).length; }

/* =========================================================
   SOUND ENGINE — Web Audio，无外部文件
   ========================================================= */
const Sound = {
  ctx:null, bus:null,
  boot(){
    if(!S.sound) return null;
    try{
      if(!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        this.ctx = new AC();
        // 统一走一个柔化的低通，去掉刺耳的高频毛刺
        const lp = this.ctx.createBiquadFilter();
        lp.type = "lowpass"; lp.frequency.value = 5200; lp.Q.value = 0.6;
        const g = this.ctx.createGain(); g.gain.value = 0.9;
        lp.connect(g); g.connect(this.ctx.destination);
        this.bus = lp;
      }
      if(this.ctx.state === "suspended") this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  /* 单个分音：快起音 + 指数衰减，像敲一下金属 */
  partial(freq, at, dur, peak, type){
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.006);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(this.bus);
    o.start(t); o.stop(t + dur + 0.03);
  },
  /* 一颗“完成”音：基音 + 八度 + 一点钟体泛音，温暖但有金属感 */
  hit(freq, at, dur, peak){
    this.partial(freq,        at, dur,        peak,        "triangle");
    this.partial(freq * 2,    at, dur * 0.72, peak * 0.30, "sine");
    this.partial(freq * 2.76, at, dur * 0.38, peak * 0.09, "sine");
  },
  /**
   * 只在整个单词写对时响一次。
   * 连击越长音越亮，连 5 给一个收束音，连 10 再高一层，然后重新开始。
   */
  done(streak){
    if(!this.boot()) return;
    const P = 0.13;
    if(streak > 0 && streak % 10 === 0){
      this.hit(659.25, 0,     0.10, P);
      this.hit(880.00, 0.085, 0.11, P);
      this.hit(1318.5, 0.170, 0.34, P * 0.85);
    }else if(streak > 0 && streak % 5 === 0){
      this.hit(659.25, 0,     0.09, P);
      this.hit(987.77, 0.075, 0.26, P * 0.9);
    }else{
      const step = Math.max(0, (streak - 1) % 5);      // 连击内逐级变亮
      const base = [739.99, 783.99, 830.61, 880.00, 932.33][Math.min(step, 4)];
      this.hit(base, 0, 0.20, P);
    }
  }
};

/* =========================================================
   SPEECH — 解锁后才可用，优先 en-US
   ========================================================= */
const Speech = {
  ok(){ try{ return typeof window !== "undefined" && "speechSynthesis" in window; }catch(e){ return false; } },
  pickVoice(){
    try{
      const vs = window.speechSynthesis.getVoices() || [];
      return vs.find(v => /^en[-_]US/i.test(v.lang)) || vs.find(v => /^en/i.test(v.lang)) || null;
    }catch(e){ return null; }
  },
  say(text, rate){
    if(!this.ok()) return false;
    try{
      const u = new SpeechSynthesisUtterance(text);
      const v = this.pickVoice();
      if(v) u.voice = v;
      u.lang = (v && v.lang) || "en-US";
      u.rate = rate || 0.92;
      u.pitch = 1;
      window.speechSynthesis.cancel();
      window.speechSynthesis.speak(u);
      return true;
    }catch(e){ return false; }
  }
};

/* =========================================================
   SPELL CHECK
   ========================================================= */
function normalize(s){ return (s||"").trim().toLowerCase(); }
function isPerfect(typed, answer){ return normalize(typed) === normalize(answer); }

/**
 * 编辑距离对齐。答案尾部允许自由留空——还没写到的字母不算错。
 * 返回 { marks:[每个输入字符 "ok"|"sub"|"ins"], missing:Set(被跳过的答案下标),
 *        used:已消耗的答案长度, wrong:错误总数 }
 */
function analyze(rawTyped, answer){
  const t = (rawTyped || "").toLowerCase(), a = answer.toLowerCase();
  const n = t.length, m = a.length;
  const D = [];
  for(let i=0;i<=n;i++){ D.push(new Array(m+1).fill(0)); D[i][0] = i; }
  for(let j=0;j<=m;j++) D[0][j] = j;
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      const c = t[i-1] === a[j-1] ? 0 : 1;
      D[i][j] = Math.min(D[i-1][j-1] + c, D[i-1][j] + 1, D[i][j-1] + 1);
    }
  }
  // 尾部自由留空：在最后一行里挑代价最小的列，平手时取更靠右的
  let best = D[n][0], j = 0;
  for(let k=1;k<=m;k++){ if(D[n][k] <= best){ best = D[n][k]; j = k; } }
  const used = j;
  const marks = new Array(n), missing = new Set();
  let i = n;
  while(i > 0 || j > 0){
    if(i > 0 && j > 0 && D[i][j] === D[i-1][j-1] + (t[i-1] === a[j-1] ? 0 : 1)){
      marks[i-1] = t[i-1] === a[j-1] ? "ok" : "sub"; i--; j--;
    }else if(j > 0 && D[i][j] === D[i][j-1] + 1){
      missing.add(j-1); j--;                      // 漏掉的答案字母
    }else{
      marks[i-1] = "ins"; i--;                    // 多打的字母
    }
  }
  const wrong = marks.filter(x => x !== "ok").length + missing.size;
  return { marks, missing, used, wrong };
}
function wrongCount(typed, answer){ return analyze(normalize(typed), answer).wrong; }

/* =========================================================
   QUEUE — 错词回队尾，未写熟的词循环出现
   ========================================================= */
let queue = [], cur = null, wState = "typing", errored = false;

function masteredCount(){ return bankStats(S.bank).unlocked; }
function buildQueue(){
  const left = bankWords(S.bank).filter(w => (S.oks[kw(w.word)] || 0) < AUDIO_AT);
  // 已经开过头的词优先做完，再放新词
  const started = left.filter(w => S.oks[kw(w.word)] > 0);
  const fresh   = left.filter(w => !S.oks[kw(w.word)]);
  queue = started.concat(fresh).slice(0, ROUND);
}
function pushBack(word){ queue.push(word); }

   RENDER

const $ = id => document.getElementById(id);

const LSPACE = 0.34;   // 字距（em），答案行与输入框必须完全一致
function fitPlate(){
  const n = cur.word.length + 3;                 // 3 格富余，写多了也不会挤出去
  const avail = Math.min(window.innerWidth || 360, 600) - 48;
  // 等宽字体单字步进 ≈ 0.6em，加字距
  let size = Math.floor(avail / (n * (0.6 + LSPACE)));
  size = Math.max(14, Math.min(32, size));
  $("wPlate").style.setProperty("--cw", size + "px");
  $("wPlate").style.setProperty("--ls", LSPACE + "em");
}

function paintWordProgress(){

}
function renderWord(){

/**
 * 通用对位渲染。只负责“画”，绝不修改输入框的值或光标。
 * 输入框文字透明，背后这层用同样的字体与字距渲染，因此逐字对齐。
 */
function paintPlate(ansEl, ghostEl, inputEl, answer, done){
  const raw = inputEl.value;
  const st  = done ? null : analyze(raw, answer);
  ansEl.innerHTML = [...answer].map((c, i) =>
    `<span class="cell${st && st.missing.has(i) ? " miss" : ""}">${esc(c)}</span>`).join("");
  let html = "";
  for(let i=0;i<raw.length;i++){
    const m = st ? st.marks[i] : "ok";
    const cls = m === "ins" ? "cell extra" : (m === "sub" ? "cell miss" : "cell");
    html += `<span class="${cls}">${esc(raw[i])}</span>`;
  }
  if(st) for(let i=st.used;i<answer.length;i++) html += '<span class="cell slot">·</span>';
  ghostEl.innerHTML = html;
  return st;
}
function renderPlate(){
  const st = paintPlate($("wAnswer"), $("wTyped"), $("keys"), cur.word, wState === "ok");
  $("wStage").className = "stage" + (wState === "ok" ? " ok" : "");
  return st;
}

function setHint(text, kind){
  $("wHint").textContent = text;
  $("wHint").className = "hint" + (kind ? " " + kind : "");
}

/* =========================================================
   WORD ENGINE
   ========================================================= */
function startWords(){
  buildQueue();
  if(!queue.length){
    $("dTitle").textContent = bankName(S.bank) + " 全部满 20 次了";
    $("dText").textContent = "这个词库的 " + bankStats(S.bank).total + " 个词都写满 20 次、语音全部解锁，可以换一个词库或去练句子。";
    show("done"); return;
  }
  show("word");
  nextWord();
}

function nextWord(){
  if(!queue.length){
    $("dTitle").textContent = "这一轮写完了";
    $("dText").textContent = "今日完成 " + S.today + " 次，" + bankName(S.bank) + " 已解锁语音 " + masteredCount() + " 个词。";
    show("done"); renderHome(); return;
  }
  cur = queue[0];
  wState = "typing";
  errored = false;
  $("keys").value = "";
  renderWord();
  setHint("照着上面写一遍");
  setTimeout(()=>$("keys").focus(), 30);
}

/**
 * 输入框每次变化都走这里。只读值、只重画，不写回 value、不动 selection。
 */
function onInput(){
  if(wState === "ok") return;
  const ans = cur.word, raw = $("keys").value;
  if(isPerfect(raw, ans)){ complete(); return; }
  const st = renderPlate();
  // 写满长度还不对，才算这一次写错（只记一次，之后随便改）
  if(!errored && normalize(raw).length >= ans.length && st.wrong > 0){ commitError(); return; }
  if(errored){
    setHint(st.wrong ? "还有 " + st.wrong + " 个字母对不上" : "继续写完", st.wrong ? "warn" : null);
  }else{
    setHint(st.wrong ? "标红的字母对不上" : "照着上面写一遍", st.wrong ? "warn" : null);
  }
}

/** 记一次写错：只单独计数，绝不减少已经拿到的成功次数。不清空输入，不播成功音。 */
function commitError(){
  errored = true;
  wState = "error";
  const w = kw(cur.word);
  S.errs[w] = (S.errs[w] || 0) + 1;
  S.streak = 0;
  saveState();
  renderPlate();
  $("wStreak").textContent = "";
  $("wStreak").className = "right";
  setHint("标红的字母对不上，自己改过来", "warn");
  if(queue[0] === cur){ queue.shift(); pushBack(cur); }
}

function complete(){
  const w = kw(cur.word);
  wState = "ok";
  S.oks[w] = (S.oks[w] || 0) + 1;      // 只有完整正确这一次才 +1
  S.streak += 1;
  S.today += 1;
  const n = S.oks[w];
  const at = queue.indexOf(cur);
  if(at > -1) queue.splice(at, 1);
  if(n < AUDIO_AT) pushBack(cur);      // 没满 20 就回队尾接着练
  saveNow();
  Sound.done(S.streak);
  renderPlate();
  paintWordProgress();
  $("wStreak").textContent = S.streak >= 2 ? "连 " + S.streak : "";
  $("wStreak").className = "right" + (S.streak >= 5 ? " hot" : "");
  setHint(n === AUDIO_AT ? "满 20 次，这个词的语音解锁了" : "对了", "good");
  setTimeout(()=>{ if(wState === "ok") nextWord(); }, n === AUDIO_AT ? 1100 : 620);
}

/* =========================================================
   IMPORT / EXPORT — 自定义词库与学习数据备份
   ========================================================= */
const HEADS = {
  word:"word", 英文:"word", 单词:"word",
  meaning:"meaning", 中文:"meaning", 释义:"meaning", 翻译:"meaning",
  phonetic:"phonetic", 音标:"phonetic", 发音:"phonetic",
  example:"example", 例句:"example", 例子:"example",
  source:"source", 来源:"source", 词库:"source",
  successcount:"successCount", 成功次数:"successCount",
  mastery:"mastery", 写熟度:"mastery",
  correctcount:"correctCount", 正确次数:"correctCount",
  wrongcount:"wrongCount", 错误次数:"wrongCount"
};
function splitCSV(line){
  const out = []; let cell = "", q = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(q){
      if(c === '"' && line[i+1] === '"'){ cell += '"'; i++; }
      else if(c === '"') q = false;
      else cell += c;
    }else if(c === '"') q = true;
    else if(c === ","){ out.push(cell); cell = ""; }
    else cell += c;
  }
  out.push(cell);
  return out.map(s => s.trim());
}
function splitLine(line){
  if(line.indexOf("|") > -1) return line.split("|").map(s => s.trim());
  if(line.indexOf("\t") > -1) return line.split("\t").map(s => s.trim());
  return splitCSV(line);
}
/** 解析 CSV / TXT，返回 {items, skipped, hasProgress} */
function parseImport(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && l[0] !== "#");
  if(!lines.length) return { items:[], skipped:0, hasProgress:false };
  let map = ["word","meaning","phonetic","example"];
  const first = splitLine(lines[0]).map(s => s.toLowerCase());
  const looksHeader = first.some(c => HEADS[c] === "word") && first.some(c => HEADS[c] === "meaning");
  if(looksHeader){ map = first.map(c => HEADS[c] || null); lines.shift(); }
  const hasProgress = map.indexOf("successCount") > -1 || map.indexOf("mastery") > -1 || map.indexOf("correctCount") > -1;
  const items = []; let skipped = 0;
  lines.forEach(l => {
    const p = splitLine(l), o = {};
    map.forEach((f, i) => { if(f && p[i] !== undefined) o[f] = p[i]; });
    o.word = (o.word || "").replace(/^["']|["']$/g, "").trim();
    o.meaning = (o.meaning || "").trim();
    if(!/^[A-Za-z][A-Za-z' .-]*$/.test(o.word) || !o.meaning){ skipped++; return; }
    items.push({
      word:o.word, meaning:o.meaning,
      phonetic:(o.phonetic || "").trim(), example:(o.example || "").trim(),
      successCount:+o.successCount || 0, mastery:+o.mastery || 0,
      correctCount:+o.correctCount || 0, wrongCount:+o.wrongCount || 0
    });
  });
  return { items:dedup(items), skipped, hasProgress };
}

let pending = null;   // 待确认的导入
function known(k){ return !!(BOOKS.field.concat(BOOKS.cet4, BOOKS.cet6).some(w => kw(w.word) === k)); }
function showPreview(res){
  pending = res;
  const mineKeys = new Set((S.mine || []).map(w => kw(w.word)));
  let add = 0, dup = 0, withRec = 0;
  res.items.forEach(it => {
    const k = kw(it.word);
    if(mineKeys.has(k)) dup++; else add++;
    if(S.oks[k]) withRec++;
  });
  pending.add = add; pending.dup = dup;
  $("impSum").innerHTML =
    "<b>" + res.items.length + "</b> 个单词<br>新增 " + add + "　重复 " + dup +
    "<i>" + (withRec ? "其中 " + withRec + " 个已有学习记录，会原样保留。" : "重复的词保留原来的学习记录。") +
    (res.skipped ? " 跳过 " + res.skipped + " 行无法识别的内容。" : "") +
    (res.hasProgress ? " 文件含学习记录，导入时一并恢复。" : "") + "</i>";
  $("impTable").innerHTML = res.items.slice(0, 40).map(it => {
    const d = mineKeys.has(kw(it.word)) || known(kw(it.word));
    return `<div class="improw${d ? " dup" : ""}"><span class="w">${esc(it.word)}</span><span class="m">${esc(it.meaning)}</span></div>`;
  }).join("") + (res.items.length > 40 ? `<div class="improw"><span class="m">…… 其余 ${res.items.length - 40} 个</span></div>` : "");
  show("import");
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c])); }

function applyImport(mode){
  if(!pending) return;
  const base = mode === "replace" ? [] : (S.mine || []).slice();
  const seen = new Map(base.map((w, i) => [kw(w.word), i]));
  pending.items.forEach(it => {
    const k = kw(it.word);
    if(seen.has(k)){                       // 重复词不新建，只补全空字段
      const t = base[seen.get(k)];
      if(!t.phonetic && it.phonetic) t.phonetic = it.phonetic;
      if(!t.example && it.example) t.example = it.example;
    }else{
      seen.set(k, base.length);
      base.push({ word:it.word, meaning:it.meaning, phonetic:it.phonetic, example:it.example });
    }
    if(pending.hasProgress){               // 只补更高的记录，不覆盖更好的成绩
      const got = Math.max(it.successCount || 0, it.correctCount || 0, it.mastery || 0);
      if(got > (S.oks[k] || 0)) S.oks[k] = got;
      if(it.wrongCount > (S.errs[k] || 0)) S.errs[k] = it.wrongCount;
    }
  });
  S.mine = base;
  S.bank = "mine";
  pending = null;
  saveNow();
  renderLib();
  show("lib");
}

function exportCSV(){
  const rows = [["word","meaning","phonetic","example","source","successCount","mastery","correctCount","wrongCount"]];
  const out = new Map();
  bankWords("mine").forEach(w => out.set(kw(w.word), w));
  // 任何有学习记录的词也一起带走，换手机后记录不丢
  ["field","cet4","cet6"].forEach(id => bankWords(id).forEach(w => {
    const k = kw(w.word);
    if(!out.has(k) && (S.oks[k] || S.errs[k])) out.set(k, w);
  }));
  out.forEach(w => {
    const r = record(w);
    rows.push([r.word, r.meaning, r.phonetic, r.example, r.source || "我的词库", r.successCount, r.mastery, r.correctCount, r.wrongCount]);
  });
  const csv = rows.map(r => r.map(c => {
    const s = String(c == null ? "" : c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\n");
  download("engineer-english-" + today() + ".csv", csv);
  return csv;
}
function download(name, text){
  try{
    const blob = new Blob(["\ufeff" + text], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    return true;
  }catch(e){ return false; }
}

function renderLib(){
  $("libList").innerHTML = BANKS.map(b => {
    const st = bankStats(b.id);
    const empty = b.id === "mine" && !st.total;
    return `<button class="bank${b.id===S.bank?" cur":""}" data-bank="${b.id}">
      <span class="nm">${b.name}<i>${empty ? "还没有导入" : b.note}</i></span>
      <span class="num">${st.total} 词<br><em>已解锁 ${st.unlocked}</em> · 学习中 ${st.learning}</span>
    </button>`;
  }).join("");
}

/* =========================================================
   SENTENCE ENGINE
   句子有自己独立的一套次数：写对 20 次解锁「这个句子」的语音。
   单词的次数不会让句子 +1，句子的次数也不会让单词 +1。
   ========================================================= */
let sIdx = 0, sState = "typing", sErrored = false;

function startSents(){
  sIdx = S.sentIdx % SENTS.length;
  openSentInput();
}

/* ---- 第一步：照着输入英文 ---- */
function openSentInput(){
  sState = "typing";
  sErrored = false;
  $("siKeys").value = "";
  show("sinput");
  renderSentInput();
  setSHint("照着上面写一遍");
  setTimeout(()=>{ $("siKeys").focus(); autoGrow(); }, 40);
}
function renderSentInput(){
  const r = sentRecord(sIdx);
  paintPlate($("siAnswer"), $("siTyped"), $("siKeys"), r.text, sState === "ok");
  $("siProgress").textContent = "输入进度 " + Math.min(r.successCount, AUDIO_AT) + " / " + AUDIO_AT;
  $("siSay").hidden = !r.audioUnlocked;
  $("siCount").textContent = (sIdx + 1) + "/" + SENTS.length;
  $("siRail").style.width = ((sIdx + 1) / SENTS.length * 100) + "%";
  document.querySelector(".sinput").className = "sinput" + (sState === "ok" ? " ok" : "");
  autoGrow();
}
function autoGrow(){
  const t = $("siKeys");
  t.style.height = "auto";
  t.style.height = Math.max(t.scrollHeight, 0) + "px";
}
function setSHint(text, kind){
  $("siHint").textContent = text;
  $("siHint").className = "hint" + (kind ? " " + kind : "");
}
function onSentInput(){
  if(sState === "ok") return;
  const ans = SENTS[sIdx][0], raw = $("siKeys").value;
  if(isPerfect(raw, ans)){ sentComplete(); return; }
  const st = paintPlate($("siAnswer"), $("siTyped"), $("siKeys"), ans, false);
  autoGrow();
  if(!sErrored && normalize(raw).length >= ans.length && st.wrong > 0){ sentCommitError(); return; }
  setSHint(st.wrong ? (sErrored ? "还有 " + st.wrong + " 处对不上" : "标红的字母对不上") : "照着上面写一遍",
           st.wrong ? "warn" : null);
}
function sentCommitError(){
  sErrored = true;
  sState = "error";
  S.sErrs[sIdx] = (S.sErrs[sIdx] || 0) + 1;   // 单独统计，不动成功次数
  S.streak = 0;
  saveState();
  paintPlate($("siAnswer"), $("siTyped"), $("siKeys"), SENTS[sIdx][0], false);
  setSHint("标红的地方对不上，自己改过来", "warn");
}
function sentComplete(){
  sState = "ok";
  S.sOks[sIdx] = (S.sOks[sIdx] || 0) + 1;     // 只有整句完全正确才 +1
  S.streak += 1;
  saveNow();
  Sound.done(S.streak);
  renderSentInput();
  const n = S.sOks[sIdx];
  setSHint(n === AUDIO_AT ? "满 20 次，这句话的语音解锁了" : "写对了", "good");
  setTimeout(()=>{ if(sState === "ok") openUnderstand(); }, n === AUDIO_AT ? 1200 : 700);
}

/* ---- 第二步：句子理解（流程原样保留） ---- */
function openUnderstand(){
  show("sent");
  renderSent();
}
function renderSent(){
  const s0 = SENTS[sIdx], r = sentRecord(sIdx);
  $("sEn").textContent = s0[0];
  $("sLit").innerHTML = s0[1].split(" ").map(t => `<b>${esc(t)}</b>`).join("");
  $("sNat").textContent = s0[2];
  $("sInput").value = "";
  $("sReveal").classList.remove("on");
  $("sActs").style.display = "";
  $("sJudge").style.display = "none";
  $("sSay").hidden = !r.audioUnlocked;
  $("sCount").textContent = (sIdx + 1) + "/" + SENTS.length;
  $("sRail").style.width = ((sIdx + 1) / SENTS.length * 100) + "%";
  $("sBody").scrollTop = 0;
}
function submitSent(){
  const v = $("sInput").value.trim();
  if(!v){ $("sInput").focus(); return; }
  $("sMine").textContent = v;
  $("sReveal").classList.add("on");
  $("sActs").style.display = "none";
  $("sJudge").style.display = "flex";
  $("sInput").blur();
}
function judgeSent(hit){
  if(hit) S.sentHit++; else S.sentMiss++;
  sIdx = (sIdx + 1) % SENTS.length;
  S.sentIdx = sIdx;
  saveNow();
  openSentInput();          // 下一句，仍然先写英文
}

/* =========================================================
   EVENTS
   ========================================================= */
document.querySelectorAll("[data-home]").forEach(b =>
  b.addEventListener("click", ()=>{ saveNow(); show("home"); renderHome(); }));

$("hStart").addEventListener("click", ()=>{ Sound.boot(); startWords(); });
$("hSent").addEventListener("click", startSents);
$("hBankRow").addEventListener("click", ()=>{ renderLib(); show("lib"); });

$("libList").addEventListener("click", e=>{
  const b = e.target.closest("[data-bank]"); if(!b) return;
  const id = b.dataset.bank;
  if(!bankWords(id).length){ return; }          // 空词库不给切过去
  S.bank = id; saveNow(); renderLib(); renderHome();
});
$("btnImport").addEventListener("click", ()=>$("fileIn").click());
$("fileIn").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    const res = parseImport(String(r.result || ""));
    if(!res.items.length){
      $("impSum").innerHTML = "<b>0</b> 个单词<i>这个文件里没有认出可用的词。每行需要至少有英文和中文，例如 equipment|设备。</i>";
      $("impTable").innerHTML = ""; pending = null; show("import"); return;
    }
    showPreview(res);
  };
  r.readAsText(f, "utf-8");
  e.target.value = "";
});
$("impAppend").addEventListener("click", ()=>applyImport("append"));
$("impReplace").addEventListener("click", ()=>applyImport("replace"));
$("impCancel").addEventListener("click", ()=>{ pending = null; renderLib(); show("lib"); });
$("btnExport").addEventListener("click", exportCSV);

$("pickSound").addEventListener("click", e=>{
  const b = e.target.closest("[data-snd]"); if(!b) return;
  S.sound = b.dataset.snd === "1"; saveNow(); renderHome();
  if(S.sound) Sound.boot();
});

$("keys").addEventListener("input", onInput);
$("keys").addEventListener("keydown", e=>{
  if(e.key === "Enter"){ e.preventDefault(); confirmWord(); }
});
$("wPlate").addEventListener("click", e=>{ if(e.target !== $("keys")) $("keys").focus(); });
$("wConfirm").addEventListener("click", confirmWord);

function confirmWord(){
  if(wState === "ok"){ nextWord(); return; }
  Sound.boot();
  if(isPerfect($("keys").value, cur.word)) complete();
  else if(!errored) commitError();
  else { renderPlate(); setHint("还有 " + wrongCount($("keys").value, cur.word) + " 个字母对不上", "warn"); }
}

$("siKeys").addEventListener("input", onSentInput);
$("siKeys").addEventListener("keydown", e=>{
  if(e.key === "Enter" && !e.shiftKey){ e.preventDefault(); confirmSent(); }
});
$("siPlate").addEventListener("click", e=>{ if(e.target !== $("siKeys")) $("siKeys").focus(); });
$("siConfirm").addEventListener("click", confirmSent);
function confirmSent(){
  if(sState === "ok"){ openUnderstand(); return; }
  Sound.boot();
  const ans = SENTS[sIdx][0];
  if(isPerfect($("siKeys").value, ans)) sentComplete();
  else if(!sErrored) sentCommitError();
  else setSHint("还有 " + wrongCount($("siKeys").value, ans) + " 处对不上", "warn");
}
$("wSay").addEventListener("click", ()=>{
  if((S.oks[kw(cur.word)] || 0) >= AUDIO_AT) Speech.say(cur.word, 0.85);
});
$("siSay").addEventListener("click", ()=>{
  if((S.sOks[sIdx] || 0) >= AUDIO_AT) Speech.say(SENTS[sIdx][0]);
});
$("sSay").addEventListener("click", ()=>{
  if((S.sOks[sIdx] || 0) >= AUDIO_AT) Speech.say(SENTS[sIdx][0]);
});
$("sSubmit").addEventListener("click", submitSent);
$("sHit").addEventListener("click", ()=>judgeSent(true));
$("sMiss").addEventListener("click", ()=>judgeSent(false));

window.addEventListener("resize", ()=>{
  if(cur && $("s-word").classList.contains("on")){ fitPlate(); renderPlate(); }
});
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveNow(); });

/* 供自测使用 */
window.__app = { get S(){return S;}, get queue(){return queue;}, get cur(){return cur;},
  get wState(){return wState;}, get pending(){return pending;},
  get sIdx(){return sIdx;}, get sState(){return sState;},
  analyze, wrongCount, isPerfect, renderPlate, onInput, onSentInput, confirmSent, startSents, openUnderstand,
  masteredCount, totalUnlocked, sentUnlocked, bankStats, bankWords, record, sentRecord, Speech,
  parseImport, showPreview, applyImport, exportCSV, renderLib, renderHome,
  confirmWord, WORDS, SENTS, BOOKS, BANKS };

/* 放到网站上时注册离线缓存；直接用 file:// 打开则静默跳过 */
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

loadState();
if(!bankWords(S.bank).length) S.bank = "field";
renderHome();
</script>
