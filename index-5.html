<title>ENGINEER ENGLISH</title>
<style>
:root{
  --bg:#0E1317;
  --bg-2:#151C22;
  --line:#232C34;
  --ink:#E9E6DF;
  --ink-2:#8794A0;
  --ink-3:#57646F;
  --brass:#D8B45C;
  --jade:#5FBFA0;
  --rust:#C2604B;
  --mono:ui-monospace,"SF Mono","JetBrains Mono","Roboto Mono",Menlo,Consolas,"Courier New",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","HarmonyOS Sans SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{touch-action:manipulation;user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
.en,.lit,.nat,.mine,.eg{user-select:text;-webkit-user-select:text}
html{height:100%}
body{
  margin:0;min-height:100%;overflow-x:hidden;
  background:var(--bg);color:var(--ink);
  font-family:var(--sans);font-size:16px;line-height:1.6;
  -webkit-font-smoothing:antialiased;overscroll-behavior:none;
}
button{font:inherit;color:inherit;background:none;border:none;padding:0;cursor:pointer}
:focus-visible{outline:2px solid var(--brass);outline-offset:3px}

.app{
  min-height:100dvh;display:flex;flex-direction:column;
  max-width:600px;margin:0 auto;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.screen{display:none;flex:1;flex-direction:column;min-height:0}
.screen.on{display:flex}

/* ============ 首页 ============ */
.home{flex:1;display:flex;flex-direction:column;padding:0 26px 30px}
.title{
  margin:7vh 0 0;font-family:var(--mono);font-size:13px;
  letter-spacing:.36em;color:var(--ink-3);
}
.stats{margin-top:auto;display:flex;flex-direction:column}
.stat{
  display:flex;align-items:baseline;justify-content:space-between;
  padding:20px 0;border-bottom:1px solid var(--line);width:100%;text-align:left;
}
.stat:first-child{border-top:1px solid var(--line)}
.stat .k{color:var(--ink-2);font-size:14.5px;letter-spacing:.02em}
.stat .v{font-family:var(--mono);font-size:30px;color:var(--ink);letter-spacing:-.01em}
.stat .v small{font-size:15px;color:var(--ink-3)}
.stat .v.lock{font-size:15px;color:var(--ink-3);letter-spacing:.02em}
.stat .v.open{font-size:15px;color:var(--brass);letter-spacing:.02em}

.start{
  margin-top:34px;height:56px;width:100%;border-radius:13px;
  background:var(--brass);color:#181206;font-weight:600;letter-spacing:.14em;
  display:flex;align-items:center;justify-content:center;transition:opacity .15s;
}
.start:active{opacity:.82}

.prefs{margin-top:30px;display:flex;flex-direction:column;gap:16px}
.pref{display:flex;align-items:center;justify-content:space-between;gap:16px}
.pref .lab{color:var(--ink-3);font-size:13px;letter-spacing:.02em;white-space:nowrap}
.pick{display:flex;gap:8px}
.pick button{
  min-width:52px;height:34px;border-radius:9px;border:1px solid var(--line);
  color:var(--ink-3);font-family:var(--mono);font-size:13px;
}
.pick button.sel{border-color:var(--brass);color:var(--brass)}

/* ============ 顶栏 ============ */
.bar{display:flex;align-items:center;gap:12px;padding:14px 22px 10px;min-height:50px}
.bar .back{color:var(--ink-2);font-size:15px}
.bar .mid{flex:1;text-align:center;color:var(--ink-3);font-size:12.5px;letter-spacing:.12em;font-family:var(--mono)}
.bar .right{min-width:58px;text-align:right;font-family:var(--mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.bar .right.hot{color:var(--brass)}
.rail{height:2px;background:var(--line);margin:0 22px;border-radius:2px;overflow:hidden}
.rail i{display:block;height:100%;width:0;background:var(--brass);transition:width .3s ease}

/* ============ 铭牌 ============ */
.stage{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding:12px 22px;overflow-y:auto}
.zh{text-align:center;font-size:29px;font-weight:600;letter-spacing:.05em;line-height:1.35}
.ipa{text-align:center;font-family:var(--mono);font-size:12.5px;color:var(--ink-3);margin-top:8px;letter-spacing:.02em}

.plate{position:relative;margin:32px auto 0;width:fit-content;max-width:100%;padding:4px 0}
.row{display:flex;justify-content:center}
.cell{
  width:1.06em;text-align:center;font-family:var(--mono);
  font-size:var(--cw,30px);line-height:1.5;
}
.answer .cell{color:var(--brass)}
.answer .cell.void{color:transparent}
.typed{margin-top:3px}
.typed .cell{
  color:var(--ink);border-bottom:1.5px solid var(--line);
  transition:color .12s ease,border-color .12s ease;
}
.typed .cell.empty{color:var(--ink-3);opacity:.35}
.typed .cell.here{border-bottom-color:var(--brass)}
.typed .cell.miss{color:var(--rust);border-bottom-color:var(--rust)}
.typed .cell.extra{color:var(--rust);border-bottom-color:var(--rust)}
.ok .typed .cell{color:var(--jade);border-bottom-color:var(--jade)}
.ok .answer .cell{color:var(--jade)}
#keys{position:absolute;inset:0;width:100%;height:100%;opacity:0;border:0;background:transparent;font-size:16px}

.hint{min-height:20px;text-align:center;margin-top:24px;font-size:13.5px;color:var(--ink-3)}
.hint.warn{color:var(--rust)}
.hint.good{color:var(--jade)}
.eg{
  margin:14px auto 0;max-width:34em;text-align:center;
  font-family:var(--mono);font-size:12.5px;line-height:1.7;color:var(--ink-3);opacity:.72;
}
.acts{padding:0 22px 26px}
.btn{
  width:100%;height:54px;border-radius:13px;background:var(--brass);color:#181206;
  font-weight:600;letter-spacing:.1em;display:flex;align-items:center;justify-content:center;
  transition:opacity .15s;
}
.btn:active{opacity:.82}
.btn.quiet{background:transparent;border:1px solid var(--line);color:var(--ink-2);font-weight:400;letter-spacing:.04em}

/* ============ 词库 ============ */
.lib{flex:1;min-height:0;overflow-y:auto;padding:6px 24px 0}
.bank{
  width:100%;text-align:left;display:flex;align-items:center;justify-content:space-between;
  gap:14px;padding:18px 0;border-bottom:1px solid var(--line);
}
.bank .nm{font-size:17px}
.bank .nm i{display:block;font-style:normal;font-size:12px;color:var(--ink-3);margin-top:4px}
.bank .num{font-family:var(--mono);font-size:12.5px;color:var(--ink-3);text-align:right;line-height:1.7;white-space:nowrap}
.bank.cur .nm{color:var(--brass)}
.bank.cur .num em{font-style:normal;color:var(--brass)}
.libfoot{padding:22px 24px 26px;display:flex;flex-direction:column;gap:12px}
.libfoot .btn{height:48px}
.tip{margin:4px 0 0;font-size:12px;line-height:1.8;color:var(--ink-3)}
.tip span{font-family:var(--mono);color:var(--ink-2)}
.impsum{padding:18px 0 16px;border-bottom:1px solid var(--line);font-size:15px;line-height:1.9}
.impsum b{font-family:var(--mono);font-weight:400;color:var(--brass);font-size:22px}
.impsum i{font-style:normal;color:var(--ink-3);font-size:13px;display:block;margin-top:6px}
.imptable{padding:12px 0 0;font-size:14.5px}
.improw{display:flex;gap:16px;padding:7px 0;border-bottom:1px solid rgba(35,44,52,.5)}
.improw .w{font-family:var(--mono);color:var(--ink);min-width:11em}
.improw .m{color:var(--ink-2);flex:1}
.improw.dup .w{color:var(--ink-3)}
.improw.dup .m:after{content:"　已有";color:var(--brass);font-size:12px}

/* ============ 句子 ============ */
.sent{flex:1;min-height:0;overflow-y:auto;padding:10px 24px 0}
.en{font-family:var(--mono);font-size:21px;line-height:1.6;margin-top:3vh}
.lit{margin-top:22px;padding-top:20px;border-top:1px solid var(--line);font-size:17px;line-height:2.05;color:var(--brass)}
.lit b{font-weight:400;padding-right:.35em}
.ask{margin-top:26px;font-size:14px;color:var(--ink-2)}
textarea{
  margin-top:10px;width:100%;min-height:100px;resize:none;
  background:var(--bg-2);border:1px solid var(--line);border-radius:12px;
  padding:14px 15px;color:var(--ink);font-family:inherit;font-size:16.5px;line-height:1.7;
}
textarea:focus{outline:none;border-color:var(--brass)}
textarea::placeholder{color:var(--ink-3)}
.reveal{display:none;margin-top:24px}
.reveal.on{display:block}
.blk{padding-top:18px;border-top:1px solid var(--line)}
.blk .k{font-size:12px;color:var(--ink-3);letter-spacing:.14em;font-family:var(--mono)}
.blk .mine{margin-top:8px;font-size:16.5px;line-height:1.75;color:var(--ink-2)}
.blk .nat{margin-top:8px;font-size:19px;line-height:1.75;color:var(--jade)}
.judge{display:flex;gap:12px;padding:22px 24px 26px}
.judge button{flex:1;height:50px;border-radius:12px;border:1px solid var(--line);color:var(--ink-2);font-size:14.5px}
.judge button.yes{border-color:var(--jade);color:var(--jade)}

/* ============ 结束页 ============ */
.done{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:0 34px;text-align:center}
.done h2{margin:0;font-size:21px;font-weight:600}
.done p{margin:0;color:var(--ink-2);font-size:14.5px}
.done .btn{max-width:240px;margin-top:14px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">

  <!-- 首页 -->
  <section class="screen on" id="s-home">
    <div class="home">
      <div class="title">ENGINEER ENGLISH</div>
      <div class="stats">
        <div class="stat"><span class="k">今日学习</span><span class="v" id="hToday">0<small> / 30</small></span></div>
        <div class="stat"><span class="k">写熟</span><span class="v" id="hMastered">0</span></div>
        <button class="stat" id="hBankRow"><span class="k">当前词库</span><span class="v open" id="hBank">现场工程词</span></button>
        <button class="stat" id="hSent"><span class="k">句子理解</span><span class="v lock" id="hSentV">未解锁</span></button>
      </div>
      <button class="start" id="hStart">开始学习</button>
      <div class="prefs">
        <div class="pref">
          <span class="lab">句子解锁</span>
          <div class="pick" id="pickTh"></div>
        </div>
        <div class="pref">
          <span class="lab">声音</span>
          <div class="pick" id="pickSound"></div>
        </div>
      </div>
    </div>
  </section>

  <!-- 单词 -->
  <section class="screen" id="s-word">
    <div class="bar">
      <button class="back" data-home>返回</button>
      <div class="mid" id="wProgress"></div>
      <div class="right" id="wStreak"></div>
    </div>
    <div class="rail"><i id="wRail"></i></div>
    <div class="stage" id="wStage">
      <div class="zh" id="wZh"></div>
      <div class="ipa" id="wIpa"></div>
      <div class="plate" id="wPlate">
        <div class="row answer" id="wAnswer"></div>
        <div class="row typed" id="wTyped"></div>
        <input id="keys" type="text" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" inputmode="text" aria-label="拼写输入">
      </div>
      <div class="hint" id="wHint"></div>
      <div class="eg" id="wEg"></div>
    </div>
    <div class="acts"><button class="btn" id="wConfirm">确认</button></div>
  </section>

  <!-- 词库 -->
  <section class="screen" id="s-lib">
    <div class="bar">
      <button class="back" data-home>返回</button>
      <div class="mid">WORD BANKS</div>
      <div class="right"></div>
    </div>

  { id:"mine",  name:"我的词库",   note:"自己导入的词" }
];
function parseRaw(raw, source){
  return raw.trim().split("\n").map(l => {
    const p = l.split("|");
    return { word:p[0].trim(), meaning:p[1].trim(), phonetic:p[2].trim(), example:p[3].trim(), source:source };
  });
}
const BOOKS = {
  field: WORDS.map(w => ({ word:w[0], meaning:w[1], phonetic:w[2], example:w[3], source:"现场工程词" })),
  cet4:  parseRaw(CET4_RAW, "CET-4"),
  cet6:  parseRaw(CET6_RAW, "CET-6")
};
const kw = w => (w || "").trim().toLowerCase();
function dedup(list){
  const seen = new Set(), out = [];
  list.forEach(w => { const k = kw(w.word); if(k && !seen.has(k)){ seen.add(k); out.push(w); } });
  return out;
}
function bankWords(id){
  if(id === "mine")  return dedup((S.mine || []).map(w => Object.assign({ source:"我的词库" }, w)));
  if(id === "cet46") return dedup(BOOKS.cet4.concat(BOOKS.cet6));
  return dedup(BOOKS[id] || BOOKS.field);
}
function bankName(id){ const b = BANKS.find(x => x.id === id); return b ? b.name : "现场工程词"; }
/** 完整数据结构：id / word / meaning / phonetic / example / source / mastery / correctCount / wrongCount */
function record(w){
  const k = kw(w.word);
  return Object.assign({ id:"w_" + k }, w, {
    mastery: S.hits[k] || 0,
    correctCount: S.oks[k] || 0,
    wrongCount: S.errs[k] || 0
  });
}
function bankStats(id){
  const ws = bankWords(id);
  let m = 0, l = 0;
  ws.forEach(w => {
    const k = kw(w.word), h = S.hits[k] || 0;
    if(h >= NEED) m++;
    else if(h > 0 || S.oks[k] || S.errs[k]) l++;
  });
  return { total:ws.length, mastered:m, learning:l };
}

/* =========================================================
   SOUND ENGINE — Web Audio，无外部文件
   ========================================================= */
const Sound = {
  ctx:null,
  boot(){
    if(!S.sound) return null;
    try{
      if(!this.ctx){
        const AC = window.AudioContext || window.webkitAudioContext;
        if(!AC) return null;
        this.ctx = new AC();
      }
      if(this.ctx.state === "suspended") this.ctx.resume();
      return this.ctx;
    }catch(e){ return null; }
  },
  note(freq, at, dur, peak, type){
    const c = this.ctx, t = c.currentTime + at;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || "triangle";
    o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(peak, t + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(c.destination);
    o.start(t); o.stop(t + dur + 0.02);
  },
  hit(streak){
    if(!this.boot()) return;
    if(streak > 0 && streak % 10 === 0){          // 连 10：稍完整的完成音
      this.note(587.33, 0,    0.09, 0.10);
      this.note(783.99, 0.075,0.10, 0.10);
      this.note(1174.7, 0.15, 0.20, 0.085,"sine");
    }else if(streak > 0 && streak % 5 === 0){     // 连 5：两声 ding
      this.note(659.25, 0,    0.07, 0.10);
      this.note(987.77, 0.065,0.16, 0.085,"sine");
    }else{                                        // 普通 tick，随连击轻微升高
      const step = Math.min(streak % 5, 4);
      this.note(760 + step * 26, 0, 0.065, 0.085);
    }
  },
  miss(){
    if(!this.boot()) return;
    this.note(196, 0, 0.075, 0.055, "sine");
  }
};

/* =========================================================
   SPELL CHECK
   ========================================================= */
function normalize(s){ return (s||"").trim().toLowerCase(); }
function isPerfect(typed, answer){ return normalize(typed) === normalize(answer); }

/**
 * 按编辑距离对齐，只标真正出错的那个字母。
 * 漏打一个字母时，后面的字母不会因为错位而全部变红。
 * 返回列数组：{a:答案字母|null, t:输入字母|null, ok:是否对上}
 *   a 为 null = 多打了一个字母
 *   t 为 null = 漏了一个字母
 */
function align(typed, answer){
  const t = normalize(typed), a = answer.toLowerCase();
  const n = t.length, m = a.length;
  const D = [];
  for(let i=0;i<=n;i++){ D.push(new Array(m+1).fill(0)); D[i][0] = i; }
  for(let j=0;j<=m;j++) D[0][j] = j;
  for(let i=1;i<=n;i++){
    for(let j=1;j<=m;j++){
      const c = t[i-1] === a[j-1] ? 0 : 1;
      D[i][j] = Math.min(D[i-1][j-1] + c, D[i-1][j] + 1, D[i][j-1] + 1);
    }
  }
  const cols = [];
  let i = n, j = m;
  while(i > 0 || j > 0){
    if(i > 0 && j > 0 && D[i][j] === D[i-1][j-1] + (t[i-1] === a[j-1] ? 0 : 1)){
      cols.push({ a:answer[j-1], t:t[i-1], ok:t[i-1] === a[j-1] }); i--; j--;
    }else if(j > 0 && D[i][j] === D[i][j-1] + 1){
      cols.push({ a:answer[j-1], t:null, ok:false }); j--;      // 漏字母
    }else{
      cols.push({ a:null, t:t[i-1], ok:false }); i--;           // 多字母
    }
  }
  return cols.reverse();
}
function wrongCount(typed, answer){
  return align(typed, answer).filter(c => !c.ok).length;
}

/* =========================================================
   QUEUE — 错词回队尾，未写熟的词循环出现
   ========================================================= */
let queue = [], cur = null, wState = "typing", typed = "";

function masteredCount(){ return bankStats(S.bank).mastered; }
function buildQueue(){
  const left = bankWords(S.bank).filter(w => (S.hits[kw(w.word)] || 0) < NEED);
  // 已经开过头的词优先做完，再放新词
  const started = left.filter(w => S.hits[kw(w.word)] > 0);
  const fresh   = left.filter(w => !S.hits[kw(w.word)]);
  queue = started.concat(fresh).slice(0, ROUND);
}
function pushBack(word){ queue.push(word); }

/* =========================================================
   RENDER
   ========================================================= */
const $ = id => document.getElementById(id);

function show(name){
  document.querySelectorAll(".screen").forEach(s => s.classList.remove("on"));
  $("s-"+name).classList.add("on");
}

function renderHome(){
  const m = masteredCount();
  $("hToday").innerHTML = S.today + "<small> / " + DAILY + "</small>";
  $("hMastered").textContent = m;
  $("hBank").textContent = bankName(S.bank);
  const total = totalMastered();
  const open = total >= S.th;
  $("hSentV").textContent = open ? "已解锁" : "还差 " + (S.th - total) + " 词";
  $("hSentV").className = "v " + (open ? "open" : "lock");

  $("pickTh").innerHTML = [10,20,30,50]
    .map(n => `<button data-th="${n}" class="${n===S.th?"sel":""}">${n}词</button>`).join("");
  $("pickSound").innerHTML =
    `<button data-snd="1" class="${S.sound?"sel":""}">开</button>` +
    `<button data-snd="0" class="${!S.sound?"sel":""}">关</button>`;
}

function fitPlate(n){
  const len = n || cur.word.length;
  const avail = Math.min(window.innerWidth || 360, 600) - 52;
  let size = Math.floor(avail / (len * 1.1));
  size = Math.max(14, Math.min(32, size));
  $("wPlate").style.setProperty("--cw", size + "px");
}

function renderWord(){
  const w = cur;
  $("wZh").textContent = w.meaning;
  $("wIpa").textContent = w.phonetic || "";
  $("wEg").textContent = w.example || "";
  $("wProgress").textContent = "写熟度 " + (S.hits[kw(w.word)]||0) + " / " + NEED;
  $("wRail").style.width = Math.min(100, S.today / DAILY * 100) + "%";
  $("wStreak").textContent = S.streak >= 2 ? "连 " + S.streak : "";
  $("wStreak").className = "right" + (S.streak >= 5 ? " hot" : "");
  fitPlate();
  renderCells();
}

function renderCells(){
  const ans = cur.word, t = normalize(typed);
  let cols;
  if(wState === "error"){
    cols = align(typed, ans);                       // 出错后按对齐结果标红
  }else{
    cols = [...ans].map((c, i) => ({ a:c, t:i < t.length ? t[i] : null, ok:true }));
    for(let i=ans.length;i<t.length;i++) cols.push({ a:null, t:t[i], ok:true });
  }
  fitPlate(cols.length);

  $("wAnswer").innerHTML = cols
    .map(c => `<span class="cell${c.a === null ? " void" : ""}">${c.a === null ? "&nbsp;" : c.a}</span>`)
    .join("");

  let html = "";
  cols.forEach((c, i) => {
    const cls = ["cell"];
    let ch = c.t;
    if(ch === null){ cls.push(c.ok ? "empty" : "miss"); ch = "·"; }
    else if(!c.ok){ cls.push(c.a === null ? "extra" : "miss"); }
    if(wState === "typing" && i === t.length) cls.push("here");
    html += `<span class="${cls.join(" ")}">${ch}</span>`;
  });
  $("wTyped").innerHTML = html;
  $("wStage").className = "stage" + (wState === "ok" ? " ok" : "");
}

function setHint(text, kind){
  $("wHint").textContent = text;
  $("wHint").className = "hint" + (kind ? " " + kind : "");
}

/* =========================================================
   WORD ENGINE
   ========================================================= */
function startWords(){
  buildQueue();
  if(!queue.length){
    $("dTitle").textContent = bankName(S.bank) + " 全部写熟了";
    $("dText").textContent = "这个词库的 " + bankStats(S.bank).total + " 个词都过关了，可以换一个词库或去练句子。";
    show("done"); return;
  }
  show("word");
  nextWord();
}

function nextWord(){
  if(!queue.length){
    $("dTitle").textContent = "这一轮写完了";
    $("dText").textContent = "今日完成 " + S.today + " 次，" + bankName(S.bank) + " 已写熟 " + masteredCount() + " 个词。";
    show("done"); renderHome(); return;
  }
  cur = queue[0];
  typed = "";
  wState = "typing";
  $("keys").value = "";
  renderWord();
  setHint("照着上面写一遍");
  setTimeout(()=>$("keys").focus(), 30);
}

function onTyped(value){
  if(wState === "ok") return;
  typed = value;
  const ans = cur.word;
  if(isPerfect(typed, ans)){ complete(); return; }
  // 一旦出过错，就实时复检，让用户自己改到全对
  if(wState === "error"){
    renderCells();
    const bad = wrongCount(typed, ans);
    setHint(bad ? "还有 " + bad + " 个字母对不上" : "继续写完", bad ? "warn" : null);
    return;
  }
  if(normalize(typed).length >= ans.length){ markError(); return; }
  wState = "typing";
  renderCells();
}

function markError(){
  wState = "error";
  const w = kw(cur.word);
  S.errs[w] = (S.errs[w]||0) + 1;
  S.hits[w] = 0;              // 写熟度归零，必须重新连对 3 次
  S.streak = 0;
  saveState();
  Sound.miss();
  renderWord();
  setHint("标红的字母对不上，自己改过来", "warn");
  // 错词回到队尾，但当前这题留在屏幕上直到改对
  if(queue[0] === cur){ queue.shift(); pushBack(cur); }
}

function complete(){
  const w = kw(cur.word);
  wState = "ok";
  S.hits[w] = (S.hits[w]||0) + 1;
  S.oks[w] = (S.oks[w]||0) + 1;
  S.streak += 1;
  S.today += 1;
  // 写熟的词退出队列；没写熟的挪到队尾等下一遍
  const at = queue.indexOf(cur);
  if(at > -1) queue.splice(at, 1);
  if(S.hits[w] < NEED) pushBack(cur);
  saveNow();
  Sound.hit(S.streak);
  renderCells();
  $("wProgress").textContent = "写熟度 " + Math.min(S.hits[w],NEED) + " / " + NEED;
  $("wStreak").textContent = S.streak >= 2 ? "连 " + S.streak : "";
  $("wStreak").className = "right" + (S.streak >= 5 ? " hot" : "");
  setHint(S.hits[w] >= NEED ? "写熟了" : "对了", "good");
  setTimeout(()=>{ if(wState === "ok") nextWord(); }, 620);
}

/* =========================================================
   IMPORT / EXPORT — 自定义词库与学习数据备份
   ========================================================= */
const HEADS = {
  word:"word", 英文:"word", 单词:"word",
  meaning:"meaning", 中文:"meaning", 释义:"meaning", 翻译:"meaning",
  phonetic:"phonetic", 音标:"phonetic", 发音:"phonetic",
  example:"example", 例句:"example", 例子:"example",
  source:"source", 来源:"source", 词库:"source",
  mastery:"mastery", 写熟度:"mastery",
  correctcount:"correctCount", 正确次数:"correctCount",
  wrongcount:"wrongCount", 错误次数:"wrongCount"
};
function splitCSV(line){
  const out = []; let cell = "", q = false;
  for(let i=0;i<line.length;i++){
    const c = line[i];
    if(q){
      if(c === '"' && line[i+1] === '"'){ cell += '"'; i++; }
      else if(c === '"') q = false;
      else cell += c;
    }else if(c === '"') q = true;
    else if(c === ","){ out.push(cell); cell = ""; }
    else cell += c;
  }
  out.push(cell);
  return out.map(s => s.trim());
}
function splitLine(line){
  if(line.indexOf("|") > -1) return line.split("|").map(s => s.trim());
  if(line.indexOf("\t") > -1) return line.split("\t").map(s => s.trim());
  return splitCSV(line);
}
/** 解析 CSV / TXT，返回 {items, skipped, hasProgress} */
function parseImport(text){
  const lines = text.split(/\r?\n/).map(l => l.trim()).filter(l => l && l[0] !== "#");
  if(!lines.length) return { items:[], skipped:0, hasProgress:false };
  let map = ["word","meaning","phonetic","example"];
  const first = splitLine(lines[0]).map(s => s.toLowerCase());
  const looksHeader = first.some(c => HEADS[c] === "word") && first.some(c => HEADS[c] === "meaning");
  if(looksHeader){ map = first.map(c => HEADS[c] || null); lines.shift(); }
  const hasProgress = map.indexOf("mastery") > -1 || map.indexOf("correctCount") > -1;
  const items = []; let skipped = 0;
  lines.forEach(l => {
    const p = splitLine(l), o = {};
    map.forEach((f, i) => { if(f && p[i] !== undefined) o[f] = p[i]; });
    o.word = (o.word || "").replace(/^["']|["']$/g, "").trim();
    o.meaning = (o.meaning || "").trim();
    if(!/^[A-Za-z][A-Za-z' .-]*$/.test(o.word) || !o.meaning){ skipped++; return; }
    items.push({
      word:o.word, meaning:o.meaning,
      phonetic:(o.phonetic || "").trim(), example:(o.example || "").trim(),
      mastery:+o.mastery || 0, correctCount:+o.correctCount || 0, wrongCount:+o.wrongCount || 0
    });
  });
  return { items:dedup(items), skipped, hasProgress };
}

let pending = null;   // 待确认的导入
function known(k){ return !!(BOOKS.field.concat(BOOKS.cet4, BOOKS.cet6).some(w => kw(w.word) === k)); }
function showPreview(res){
  pending = res;
  const mineKeys = new Set((S.mine || []).map(w => kw(w.word)));
  let add = 0, dup = 0, withRec = 0;
  res.items.forEach(it => {
    const k = kw(it.word);
    if(mineKeys.has(k)) dup++; else add++;
    if(S.hits[k] || S.oks[k]) withRec++;
  });
  pending.add = add; pending.dup = dup;
  $("impSum").innerHTML =
    "<b>" + res.items.length + "</b> 个单词<br>新增 " + add + "　重复 " + dup +
    "<i>" + (withRec ? "其中 " + withRec + " 个已有学习记录，会原样保留。" : "重复的词保留原来的学习记录。") +
    (res.skipped ? " 跳过 " + res.skipped + " 行无法识别的内容。" : "") +
    (res.hasProgress ? " 文件含学习记录，导入时一并恢复。" : "") + "</i>";
  $("impTable").innerHTML = res.items.slice(0, 40).map(it => {
    const d = mineKeys.has(kw(it.word)) || known(kw(it.word));
    return `<div class="improw${d ? " dup" : ""}"><span class="w">${esc(it.word)}</span><span class="m">${esc(it.meaning)}</span></div>`;
  }).join("") + (res.items.length > 40 ? `<div class="improw"><span class="m">…… 其余 ${res.items.length - 40} 个</span></div>` : "");
  show("import");
}
function esc(s){ return String(s).replace(/[&<>]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;" }[c])); }

function applyImport(mode){
  if(!pending) return;
  const base = mode === "replace" ? [] : (S.mine || []).slice();
  const seen = new Map(base.map((w, i) => [kw(w.word), i]));
  pending.items.forEach(it => {
    const k = kw(it.word);
    if(seen.has(k)){                       // 重复词不新建，只补全空字段
      const t = base[seen.get(k)];
      if(!t.phonetic && it.phonetic) t.phonetic = it.phonetic;
      if(!t.example && it.example) t.example = it.example;
    }else{
      seen.set(k, base.length);
      base.push({ word:it.word, meaning:it.meaning, phonetic:it.phonetic, example:it.example });
    }
    if(pending.hasProgress){               // 只补更高的记录，不覆盖更好的成绩
      if(it.mastery > (S.hits[k] || 0)) S.hits[k] = Math.min(it.mastery, NEED);
      if(it.correctCount > (S.oks[k] || 0)) S.oks[k] = it.correctCount;
      if(it.wrongCount > (S.errs[k] || 0)) S.errs[k] = it.wrongCount;
    }
  });
  S.mine = base;
  S.bank = "mine";
  pending = null;
  saveNow();
  renderLib();
  show("lib");
}

function exportCSV(){
  const rows = [["word","meaning","phonetic","example","source","mastery","correctCount","wrongCount"]];
  const out = new Map();
  bankWords("mine").forEach(w => out.set(kw(w.word), w));
  // 任何有学习记录的词也一起带走，换手机后记录不丢
  ["field","cet4","cet6"].forEach(id => bankWords(id).forEach(w => {
    const k = kw(w.word);
    if(!out.has(k) && (S.hits[k] || S.oks[k] || S.errs[k])) out.set(k, w);
  }));
  out.forEach(w => {
    const r = record(w);
    rows.push([r.word, r.meaning, r.phonetic, r.example, r.source || "我的词库", r.mastery, r.correctCount, r.wrongCount]);
  });
  const csv = rows.map(r => r.map(c => {
    const s = String(c == null ? "" : c);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
  }).join(",")).join("\n");
  download("engineer-english-" + today() + ".csv", csv);
  return csv;
}
function download(name, text){
  try{
    const blob = new Blob(["\ufeff" + text], { type:"text/csv;charset=utf-8" });
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = name;
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 500);
    return true;
  }catch(e){ return false; }
}

function renderLib(){
  $("libList").innerHTML = BANKS.map(b => {
    const st = bankStats(b.id);
    const empty = b.id === "mine" && !st.total;
    return `<button class="bank${b.id===S.bank?" cur":""}" data-bank="${b.id}">
      <span class="nm">${b.name}<i>${empty ? "还没有导入" : b.note}</i></span>
      <span class="num">${st.total} 词<br><em>写熟 ${st.mastered}</em> · 学习中 ${st.learning}</span>
    </button>`;
  }).join("");
}

/* =========================================================
   SENTENCE ENGINE
   ========================================================= */
function startSents(){
  if(totalMastered() < S.th) return;
  show("sent");
  renderSent();
}
function renderSent(){
  const i = S.sentIdx % SENTS.length, s = SENTS[i];
  $("sEn").textContent = s[0];
  $("sLit").innerHTML = s[1].split(" ").map(t => `<b>${t}</b>`).join("");
  $("sNat").textContent = s[2];
  $("sInput").value = "";
  $("sReveal").classList.remove("on");
  $("sActs").style.display = "";
  $("sJudge").style.display = "none";
  $("sCount").textContent = (i+1) + "/" + SENTS.length;
  $("sRail").style.width = ((i+1) / SENTS.length * 100) + "%";
  $("sBody").scrollTop = 0;
}
function submitSent(){
  const v = $("sInput").value.trim();
  if(!v){ $("sInput").focus(); return; }
  $("sMine").textContent = v;
  $("sReveal").classList.add("on");
  $("sActs").style.display = "none";
  $("sJudge").style.display = "flex";
  $("sInput").blur();
}
function judgeSent(hit){
  if(hit) S.sentHit++; else S.sentMiss++;
  S.sentIdx = (S.sentIdx + 1) % SENTS.length;
  saveNow();
  renderSent();
}

/* =========================================================
   EVENTS
   ========================================================= */
document.querySelectorAll("[data-home]").forEach(b =>
  b.addEventListener("click", ()=>{ saveNow(); show("home"); renderHome(); }));

$("hStart").addEventListener("click", ()=>{ Sound.boot(); startWords(); });
$("hSent").addEventListener("click", startSents);
$("hBankRow").addEventListener("click", ()=>{ renderLib(); show("lib"); });

$("libList").addEventListener("click", e=>{
  const b = e.target.closest("[data-bank]"); if(!b) return;
  const id = b.dataset.bank;
  if(!bankWords(id).length){ return; }          // 空词库不给切过去
  S.bank = id; saveNow(); renderLib(); renderHome();
});
$("btnImport").addEventListener("click", ()=>$("fileIn").click());
$("fileIn").addEventListener("change", e=>{
  const f = e.target.files && e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = ()=>{
    const res = parseImport(String(r.result || ""));
    if(!res.items.length){
      $("impSum").innerHTML = "<b>0</b> 个单词<i>这个文件里没有认出可用的词。每行需要至少有英文和中文，例如 equipment|设备。</i>";
      $("impTable").innerHTML = ""; pending = null; show("import"); return;
    }
    showPreview(res);
  };
  r.readAsText(f, "utf-8");
  e.target.value = "";
});
$("impAppend").addEventListener("click", ()=>applyImport("append"));
$("impReplace").addEventListener("click", ()=>applyImport("replace"));
$("impCancel").addEventListener("click", ()=>{ pending = null; renderLib(); show("lib"); });
$("btnExport").addEventListener("click", exportCSV);

$("pickTh").addEventListener("click", e=>{
  const b = e.target.closest("[data-th]"); if(!b) return;
  S.th = +b.dataset.th; saveNow(); renderHome();
});
$("pickSound").addEventListener("click", e=>{
  const b = e.target.closest("[data-snd]"); if(!b) return;
  S.sound = b.dataset.snd === "1"; saveNow(); renderHome();
  if(S.sound) Sound.boot();
});

$("keys").addEventListener("input", e => onTyped(e.target.value));
$("keys").addEventListener("keydown", e=>{
  if(e.key === "Enter"){ e.preventDefault(); confirmWord(); }
});
$("wPlate").addEventListener("click", ()=>$("keys").focus());
$("wConfirm").addEventListener("click", confirmWord);

function confirmWord(){
  if(wState === "ok"){ nextWord(); return; }
  if(isPerfect(typed, cur.word)) complete();
  else markError();
}

$("sSubmit").addEventListener("click", submitSent);
$("sHit").addEventListener("click", ()=>judgeSent(true));
$("sMiss").addEventListener("click", ()=>judgeSent(false));

window.addEventListener("resize", ()=>{
  if(cur && $("s-word").classList.contains("on")){ fitPlate(); renderCells(); }
});
window.addEventListener("pagehide", saveNow);
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) saveNow(); });

/* 供自测使用 */
window.__app = { get S(){return S;}, get queue(){return queue;}, get cur(){return cur;},
  get wState(){return wState;}, get pending(){return pending;},
  align, wrongCount, isPerfect, masteredCount, totalMastered, bankStats, bankWords, record,
  parseImport, showPreview, applyImport, exportCSV, renderLib, renderHome,
  onTyped, confirmWord, WORDS, SENTS, BOOKS, BANKS };

/* 放到网站上时注册离线缓存；直接用 file:// 打开则静默跳过 */
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  navigator.serviceWorker.register("sw.js").catch(()=>{});
}

loadState();
if(!bankWords(S.bank).length) S.bank = "field";
renderHome();
</script>
